name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # jdesk-jcef-api extracts org.cef from the JBR's jmods/jcef.jmod, so a plain JDK cannot build it.
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '17'
          java-package: jdk+jcef
          cache: maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn -B -ntp verify
